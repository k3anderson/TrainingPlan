<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rat Race 100 — Training Plan</title>
<style>
  :root{
    --pine:#1F3A2E;
    --pine-dark:#152A21;
    --mist:#EEF1E9;
    --mist-card:#FFFFFF;
    --stone:#5B6857;
    --ink:#23261F;
    --blaze:#C84B31;
    --blaze-dark:#9C3A26;
    --gold:#C99A3A;
    --line:#DADFD2;
    --ok:#3F7A54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--mist);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Arial Narrow",Helvetica,Arial,sans-serif;
    font-weight:800;
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--pine);
    color:#fff;
    padding:14px 16px 12px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  header.top .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  header.top h1{
    color:#fff;
    font-size:22px;
    text-transform:uppercase;
  }
  header.top .today{
    font-size:12px;
    color:#C9D6CC;
    white-space:nowrap;
  }
  header.top .status-line{
    margin-top:6px;
    font-size:14px;
    color:#fff;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  header.top .status-line .pill{
    background:var(--blaze);
    color:#fff;
    padding:3px 10px;
    border-radius:20px;
    font-weight:700;
    font-size:12px;
  }

  /* ---------- Hero elevation profile ---------- */
  .hero{
    background:var(--pine);
    padding:0 0 10px;
  }
  .hero svg{display:block;width:100%;height:auto;}
  .hero .peak-label{font-size:9px;fill:#C9D6CC;}
  .hero .peak-dot{cursor:pointer;}

  /* ---------- Nav pills ---------- */
  nav.pills{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:10px 12px;
    background:var(--pine-dark);
    position:sticky;
    top:64px;
    z-index:49;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.pills::-webkit-scrollbar{display:none;}
  nav.pills button{
    flex:0 0 auto;
    background:transparent;
    border:1px solid #3C5548;
    color:#D6DED6;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  nav.pills button.active{
    background:var(--blaze);
    border-color:var(--blaze);
    color:#fff;
  }
  nav.pills button.current::after{
    content:" •";
    color:var(--gold);
  }

  /* ---------- Main ---------- */
  main{
    max-width:720px;
    margin:0 auto;
    padding:16px 14px 60px;
  }
  section.panel{display:none;}
  section.panel.active{display:block;}

  .section-title{
    font-size:20px;
    margin-bottom:4px;
  }
  .section-sub{
    color:var(--stone);
    font-size:13px;
    margin-bottom:16px;
  }

  /* ---------- Overview cards ---------- */
  .phase-card{
    background:var(--mist-card);
    border:1px solid var(--line);
    border-left:5px solid var(--stone);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .phase-card.current{
    border-left-color:var(--blaze);
    background:#FFF6F3;
  }
  .phase-card .pname{
    font-weight:800;
    font-size:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .phase-card .pdates{
    font-size:12px;
    color:var(--stone);
    margin:2px 0 6px;
  }
  .phase-card .pgoal{
    font-size:13px;
    color:var(--ink);
  }
  .badge-current{
    background:var(--blaze);
    color:#fff;
    font-size:10px;
    font-weight:700;
    padding:2px 8px;
    border-radius:12px;
    text-transform:uppercase;
    flex:0 0 auto;
  }

  /* ---------- Week accordion ---------- */
  .week-group{
    background:var(--mist-card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .week-head{
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    gap:10px;
  }
  .week-group.current-week .week-head{
    background:#FFF6F3;
  }
  .week-head .wtitle{
    font-weight:700;
    font-size:14px;
  }
  .week-head .wmeta{
    font-size:11px;
    color:var(--stone);
  }
  .week-head .chevron{
    transition:transform .2s;
    color:var(--stone);
    flex:0 0 auto;
  }
  .week-group.open .chevron{transform:rotate(180deg);}
  .week-body{
    display:none;
    border-top:1px solid var(--line);
  }
  .week-group.open .week-body{display:block;}

  .run-row{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .run-row:last-child{border-bottom:none;}
  .run-row.today{
    background:#FFF1EC;
    border-left:3px solid var(--blaze);
    padding-left:11px;
  }
  .run-row .rtop{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:13px;
    font-weight:700;
  }
  .run-row .rdate{color:var(--stone);font-weight:600;font-size:11px;}
  .run-row .rtarget{font-size:13px;margin-top:2px;}
  .run-row .rnote{font-size:12px;color:var(--stone);margin-top:2px;}
  .tag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    padding:1px 7px;
    border-radius:10px;
    background:#E4E9DE;
    color:var(--stone);
  }
  .tag.Long{background:#DCEBE0;color:var(--ok);}
  .tag.Race{background:var(--blaze);color:#fff;}
  .tag.Completed{background:var(--ok);color:#fff;}
  .tag.Upcoming{background:#E4E9DE;color:var(--stone);}

  /* ---------- Nutrition ---------- */
  .tier-card{
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    border:1px solid var(--line);
  }
  .tier-card h3{font-size:16px;margin-bottom:2px;}
  .tier-card .tsub{font-size:12px;margin-bottom:10px;}
  .chip{
    display:inline-block;
    background:rgba(255,255,255,0.6);
    border-radius:14px;
    padding:5px 11px;
    font-size:12px;
    margin:0 6px 6px 0;
  }
  .tier1{background:#E1F5EE;border-color:#0F6E56;}
  .tier1 h3, .tier1 .tsub{color:#0F6E56;}
  .tier2{background:#FAECE7;border-color:#993C1D;}
  .tier2 h3, .tier2 .tsub{color:#993C1D;}
  .tier3{background:#EEEDFE;border-color:#534AB7;}
  .tier3 h3, .tier3 .tsub{color:#534AB7;}

  .event-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    background:var(--mist-card);
  }
  .event-card.hl{border-color:var(--blaze);background:#FFF6F3;}
  .event-card .ename{font-weight:800;font-size:14px;}
  .event-card .esub{font-size:12px;color:var(--stone);margin:3px 0 8px;}
  .bar-track{background:#E4E2DA;border-radius:5px;height:8px;overflow:hidden;}
  .bar-fill{background:var(--stone);height:100%;border-radius:5px;}
  .event-card.hl .bar-fill{background:var(--blaze);}
  .bar-label{font-size:11px;color:var(--stone);margin-top:4px;text-align:right;}

  /* ---------- Notes ---------- */
  .note-line{
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .note-line:last-child{border-bottom:none;}

  footer{
    text-align:center;
    font-size:11px;
    color:var(--stone);
    padding:20px 14px 30px;
  }
</style>
</head>

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
const TODAY = todayStr();

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('en-GB',{day:'numeric', month:'short'});
}
function addDays(iso, n){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function inRange(dateIso, start, end){
  return dateIso >= start && dateIso <= end;
}

function currentPhase(){
  for(const p of PHASES){
    if(p.start && inRange(TODAY, p.start, p.end)) return p;
  }
  return null;
}

/* ---------------- Header ---------------- */
function renderHeader(){
  document.getElementById('todayLabel').textContent = fmtDate(TODAY);
  const cp = currentPhase();
  const statusLine = document.getElementById('statusLine');
  if(cp){
    statusLine.innerHTML = `<span class="pill">Phase ${cp.num}</span><span>${cp.name}</span>`;
  } else {
    statusLine.innerHTML = `<span>Plan not yet started or between phases</span>`;
  }
}

/* ---------------- Hero elevation profile ---------------- */
function renderHero(){
  const svg = document.getElementById('heroSvg');
  const phaseList = PHASES.filter(p=>p.start);
  const totalStart = new Date(phaseList[0].start).getTime();
  const totalEnd = new Date(phaseList[phaseList.length-1].end).getTime();
  const span = totalEnd - totalStart;
  const W=680,H=90, padL=20, padR=20, padT=15, padB=20;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const cp = currentPhase();

  const pts = phaseList.map((p,i)=>{
    const x = padL + (plotW*(i/(phaseList.length-1)));
    const y = padT + plotH - (plotH*(i/(phaseList.length-1))*0.9);
    return {x,y,p};
  });
  let path = "M"+pts.map(pt=>`${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(" L");
  let fillPath = path + ` L${pts[pts.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} L${pts[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  let dots = pts.map(pt=>{
    const isCur = cp && pt.p.id===cp.id;
    const r = isCur? 5:3;
    const fill = isCur? "#C84B31":"#7FA98F";
    return `<circle class="peak-dot" data-target="${pt.p.id}" cx="${pt.x}" cy="${pt.y}" r="${r}" fill="${fill}" stroke="#1F3A2E" stroke-width="1"/>`;
  }).join("");

  svg.innerHTML = `
    <path d="${fillPath}" fill="#2C4E3D" opacity="0.6"/>
    <path d="${path}" fill="none" stroke="#7FA98F" stroke-width="1.5"/>
    ${dots}
  `;
  Array.from(svg.querySelectorAll('.peak-dot')).forEach(d=>{
    d.addEventListener('click', ()=>switchPanel(d.getAttribute('data-target')));
  });
}

/* ---------------- Nav ---------------- */
function renderNav(){
  const nav = document.getElementById('pillNav');
  const cp = currentPhase();
  nav.innerHTML = PHASES.map(p=>{
    const isCurrent = cp && p.id===cp.id;
    return `<button data-target="${p.id}" class="${isCurrent?'current':''}">${p.label}</button>`;
  }).join("");
  Array.from(nav.querySelectorAll('button')).forEach(b=>{
    b.addEventListener('click', ()=>switchPanel(b.getAttribute('data-target')));
  });
}

function switchPanel(id){
  Array.from(document.querySelectorAll('section.panel')).forEach(s=>s.classList.toggle('active', s.id===id));
  Array.from(document.querySelectorAll('nav.pills button')).forEach(b=>b.classList.toggle('active', b.getAttribute('data-target')===id));
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- Overview panel ---------------- */
function renderOverview(){
  const cp = currentPhase();
  const cards = PHASES.filter(p=>p.start).map(p=>{
    const isCur = cp && p.id===cp.id;
    return `
      <div class="phase-card ${isCur?'current':''}" data-target="${p.id}">
        <div class="pname"><span>Phase ${p.num}: ${p.name}</span>${isCur?'<span class="badge-current">Now</span>':''}</div>
        <div class="pdates">${fmtDateShort(p.start)} – ${fmtDateShort(p.end)}</div>
        <div class="pgoal">${p.goal}</div>
      </div>`;
  }).join("");
  return `
    <div class="section-title">Rat Race 100 — training journey</div>
    <div class="section-sub">Couch to 5K through to a 160km ultra, July 2028. Tap a phase to open it.</div>
    ${cards}
  `;
}

/* ---------------- Phase panel (weekly grouped) ---------------- */
function groupByWeek(rows){
  const groups = {};
  const order = [];
  rows.forEach(r=>{
    const key = r["C25K Week"] || r["Week Starting"] || r["Date"];
    if(!(key in groups)){ groups[key]=[]; order.push(key); }
    groups[key].push(r);
  });
  return order.map(k=>{
    const grp = groups[k];
    const dates = grp.map(r=>r["Date"]||r["Week Starting"]).filter(Boolean).sort();
    return {key:k, rows:grp, minDate:dates[0], maxDate:dates[dates.length-1], labeled: !!grp[0]["C25K Week"]};
  });
}

function renderRunRow(r, phaseObj){
  const dateKey = r["Date"] || r["Week Starting"];
  const isToday = dateKey === TODAY;
  const runLabel = r["Run #"] || "";
  const type = r["Type"] || "";
  const status = r["Status"] || "";
  const target = r["Target"] || r["Session Structure"] || "";
  const duration = r["Est. Duration"] || "";
  const notes = r["Notes"] || "";
  const subphase = r["Sub-Phase"];
  let tag = "";
  if(status) tag = `<span class="tag ${status}">${status}</span>`;
  else if(type) tag = `<span class="tag ${type}">${type}</span>`;
  return `
    <div class="run-row ${isToday?'today':''}">
      <div class="rtop"><span>${runLabel}${subphase?` · ${subphase}`:''}</span>${tag}</div>
      <div class="rtarget">${target}${duration?` — ${duration}`:''}</div>
      ${notes?`<div class="rnote">${notes}</div>`:''}
    </div>`;
}

function renderPhasePanel(p){
  const rows = TRAINING_DATA[p.sheet] || [];
  const dated = rows.filter(r=> (r["Date"]||r["Week Starting"]) );
  const groups = groupByWeek(dated);
  const trailingNote = rows.find(r=>!(r["Date"]||r["Week Starting"]) && (r["C25K Week"]==="Note"));

  const weekHtml = groups.map(g=>{
    const weekStart = g.minDate;
    const weekEnd = g.labeled ? g.maxDate : addDays(g.minDate, 6);
    const isCurrentWeek = inRange(TODAY, weekStart, weekEnd);
    const label = g.labeled ? g.key : `Week of ${fmtDateShort(weekStart)}`;
    return `
      <div class="week-group ${isCurrentWeek?'current-week':''} ${isCurrentWeek?'open':''}">
        <div class="week-head" onclick="this.parentElement.classList.toggle('open')">
          <div>
            <div class="wtitle">${label}</div>
            <div class="wmeta">${fmtDateShort(weekStart)} – ${fmtDateShort(weekEnd)}${isCurrentWeek?' · this week':''}</div>
          </div>
          <div class="chevron">▾</div>
        </div>
        <div class="week-body">
          ${g.rows.map(r=>renderRunRow(r,p)).join("")}
        </div>
      </div>`;
  }).join("");

  return `
    <div class="section-title">Phase ${p.num}: ${p.name}</div>
    <div class="section-sub">${fmtDateShort(p.start)} – ${fmtDateShort(p.end)} · ${p.goal}</div>
    ${weekHtml}
    ${trailingNote ? `<div class="note-line">${trailingNote["Session Structure"]||''}</div>` : ''}
  `;
}

/* ---------------- Fueling panel ---------------- */
function renderFueling(){
  const rows = TRAINING_DATA["Fueling"] || [];
  const cards = rows.map(r=>`
    <div class="phase-card">
      <div class="pname">${r["Phase"]}</div>
      <div class="pgoal" style="margin-top:6px;">${r["Fueling Focus"]}</div>
    </div>`).join("");
  return `
    <div class="section-title">Fuelling by phase</div>
    <div class="section-sub">When to introduce each stage of race-day fuelling</div>
    ${cards}
  `;
}

/* ---------------- Nutrition panel ---------------- */
function renderNutrition(){
  const tiers = TRAINING_DATA["Nutrition - Tiers"] || [];
  const byEvent = TRAINING_DATA["Nutrition - By Event"] || [];

  const tierGroups = {"Tier 1":[], "Tier 2":[], "Tier 3":[]};
  tiers.forEach(r=>{ if(tierGroups[r["Tier"]]) tierGroups[r["Tier"]].push(r); });

  const tierMeta = {
    "Tier 1": {cls:"tier1", title:"Tier 1 — fast carbs", sub:"Instant hit, minimal chewing"},
    "Tier 2": {cls:"tier2", title:"Tier 2 — DIY recipes", sub:"Homemade, more substance, batch ahead"},
    "Tier 3": {cls:"tier3", title:"Tier 3 — whole foods", sub:"Aid-station food, needs chew and digest time"},
  };

  const tierHtml = Object.keys(tierMeta).map(k=>{
    const m = tierMeta[k];
    const chips = tierGroups[k].map(r=>`<span class="chip">${r["Item"]}</span>`).join("");
    return `<div class="tier-card ${m.cls}"><h3>${m.title}</h3><div class="tsub">${m.sub}</div>${chips}</div>`;
  }).join("");

  const durations = {
    "Vogrie 5K / parkrun distance": 22,
    "Drakensberg 20km (Mountain Challenge)": 165,
    "Inverness Marathon": 270,
    "Rat Race 100 (ultra)": 1620,
  };
  const durationVals = [22,165,270,1620];
  const maxLog = Math.log10(Math.max.apply(null, durationVals));
  const eventCards = byEvent.filter(r=>r["Event"]!=="Core targets (all events)").map(r=>{
    const dur = durations[r["Event"]] || 0;
    const frac = dur ? Math.log10(dur)/maxLog : 0;
    const isUltra = r["Event"].includes("Rat Race");
    return `
      <div class="event-card ${isUltra?'hl':''}">
        <div class="ename">${r["Event"]}</div>
        <div class="esub">${r["Fuelling Plan"]}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(frac*100).toFixed(0)}%"></div></div>
      </div>`;
  }).join("");

  const core = byEvent.find(r=>r["Event"]==="Core targets (all events)");

  return `
    <div class="section-title">Nutrition</div>
    <div class="section-sub">Whole-food fuelling tiers and race-day minimums</div>
    ${tierHtml}
    <div class="section-title" style="margin-top:18px;font-size:17px;">By race</div>
    <div class="phase-card" style="border-left-color:var(--gold);">
      <div class="pgoal">${core ? core["Fuelling Plan"] : ''}</div>
    </div>
    ${eventCards}
  `;
}

/* ---------------- Notes / race calendar panel ---------------- */
function renderNotes(){
  const rows = (TRAINING_DATA["Notes"]||[]).filter(r=>r["Race Booking Status"]);
  const items = rows.map(r=>`<div class="note-line">${r["Race Booking Status"]}</div>`).join("");
  return `
    <div class="section-title">Race calendar &amp; notes</div>
    <div class="section-sub">Booking status for every race on the plan</div>
    ${items}
  `;
}

/* ---------------- Build all panels ---------------- */
function renderAll(){
  renderHeader();
  renderHero();
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = PHASES.map(p=>{
    let inner = "";
    if(p.id==="overview") inner = renderOverview();
    else if(p.id==="fueling") inner = renderFueling();
    else if(p.id==="nutrition") inner = renderNutrition();
    else if(p.id==="notes") inner = renderNotes();
    else inner = renderPhasePanel(p);
    return `<section class="panel" id="${p.id}">${inner}</section>`;
  }).join("");

  Array.from(main.querySelectorAll('.phase-card[data-target]')).forEach(c=>{
    c.addEventListener('click', ()=>switchPanel(c.getAttribute('data-target')));
  });

  const cp = currentPhase();
  switchPanel(cp ? cp.id : "overview");
}

renderAll();
</script>
